<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PDF 페이지 나누기</title>
<style>
  body {
    font-family: "맑은 고딕", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px 60px;
    color: #333;
    line-height: 1.6;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-top: 0; }
  p.desc { color: #666; font-size: 14px; }
  .box {
    border: 2px dashed #bbb;
    border-radius: 12px;
    padding: 30px 20px;
    text-align: center;
    margin: 20px 0;
    background: #fafafa;
  }
  input[type=file] { font-size: 15px; }
  button {
    margin-top: 14px;
    padding: 10px 20px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: #4a7dfc;
    color: white;
    cursor: pointer;
  }
  button.secondary { background: #888; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #status, #status2 { margin-top: 16px; font-size: 14px; white-space: pre-line; }
  #result, #result2 { margin-top: 16px; }
  a.download {
    display: inline-block;
    padding: 10px 20px;
    background: #22b573;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
  }
  .note {
    font-size: 12px;
    color: #999;
    margin-top: 30px;
  }
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin: 20px 0 0;
  }
  .mode-tabs button {
    flex: 1;
    margin-top: 0;
    background: #eee;
    color: #333;
  }
  .mode-tabs button.active {
    background: #4a7dfc;
    color: white;
  }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }
  .global-controls {
    background: #f0f4ff;
    border-radius: 10px;
    padding: 16px;
    margin: 16px 0;
    text-align: left;
    font-size: 14px;
  }
  .global-controls label { display: block; margin-bottom: 8px; }
  .global-controls .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .global-controls input[type=range] { flex: 1; }
  #pageList { display: flex; flex-direction: column; gap: 18px; margin-top: 20px; }
  .page-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    text-align: left;
  }
  .page-card .idx { font-weight: bold; font-size: 13px; color: #555; margin-bottom: 6px; }
  .canvas-wrap { position: relative; display: inline-block; max-width: 100%; }
  .canvas-wrap canvas { max-width: 100%; height: auto; display: block; border: 1px solid #ccc; }
  .cutline {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: red;
    pointer-events: none;
  }
  .page-controls { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; }
  .page-controls input[type=range] { width: 200px; }
</style>
<!-- 홈 화면 앱 설치용 (✂️ 아이콘) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="install.js" defer></script>
<meta name="theme-color" content="#e8eef3">
</head>
<body>

<h1>PDF 페이지 나누기</h1>
<p class="desc">
  두 페이지가 한 장에 붙어있는 PDF를 올리면 한 페이지씩 나눠드려요.
</p>

<div class="mode-tabs">
  <button id="tabAuto" class="active">자동 모드</button>
  <button id="tabManual">직접 확인 모드 (사진 찍은 파일용)</button>
</div>

<!-- ===================== 자동 모드 ===================== -->
<div id="panelAuto" class="mode-panel active">
<p class="desc">
  그림책처럼 페이지 폭이 뚜렷하게 다르면 자동으로 찾아서 나눠줘요.
</p>
<div class="box">
  <input type="file" id="fileInput" accept="application/pdf">
  <br>
  <label style="display:block; margin-top:14px; font-size:14px; text-align:left;">
    <input type="checkbox" id="forceAll">
    모든 페이지를 무조건 반으로 나누기 (자동 감지 안 됐을 때 체크)
  </label>
  <button id="runBtn" disabled>나누기 시작</button>
  <div id="status"></div>
  <div id="result"></div>
</div>
</div>

<!-- ===================== 직접 확인 모드 ===================== -->
<div id="panelManual" class="mode-panel">
<p class="desc">
  폰카메라로 찍은 책처럼 페이지마다 접힌 위치가 다르면, 이 모드에서 한 장씩 직접 확인하고 잘라주세요.
</p>
<div class="box">
  <input type="file" id="fileInput2" accept="application/pdf">
  <br>
  <button id="previewBtn" disabled>미리보기 만들기</button>
  <div id="status2"></div>
</div>

<div class="global-controls" id="globalControls" style="display:none;">
  <label>빨간 선 위치 (자르는 기준선) — 아래 값을 바꾸고 "전체 적용"을 누르면 모든 페이지에 한번에 적용돼요.</label>
  <div class="row">
    <span>왼쪽</span>
    <input type="range" id="globalFrac" min="0" max="100" value="50">
    <span>오른쪽</span>
    <button id="applyFracAll" class="secondary">전체 페이지에 적용</button>
  </div>
  <label style="margin-top:10px;">회전</label>
  <div class="row">
    <button id="applyRotAll" class="secondary">전체 페이지 90도 회전</button>
  </div>
</div>

<div id="pageList"></div>

<div class="box" id="exportBox" style="display:none;">
  <button id="exportBtn">이대로 저장하기</button>
  <div id="result2"></div>
</div>
</div>

<p class="note">
  ※ 이 파일(index.html)과 pdf-lib.min.js, pdf.min.js, pdf.worker.min.js 파일이 모두 같은 폴더 안에 함께 있어야 해요.<br>
  ※ 인터넷 연결 없이도 사용할 수 있어요.
</p>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

// ---------- 탭 전환 ----------
const tabAuto = document.getElementById('tabAuto');
const tabManual = document.getElementById('tabManual');
const panelAuto = document.getElementById('panelAuto');
const panelManual = document.getElementById('panelManual');

tabAuto.addEventListener('click', () => {
  tabAuto.classList.add('active');
  tabManual.classList.remove('active');
  panelAuto.classList.add('active');
  panelManual.classList.remove('active');
});
tabManual.addEventListener('click', () => {
  tabManual.classList.add('active');
  tabAuto.classList.remove('active');
  panelManual.classList.add('active');
  panelAuto.classList.remove('active');
});

// ---------- 자동 모드 (기존 로직) ----------
const fileInput = document.getElementById('fileInput');
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
let selectedFile = null;

fileInput.addEventListener('change', () => {
  selectedFile = fileInput.files[0] || null;
  runBtn.disabled = !selectedFile;
  statusEl.textContent = '';
  resultEl.innerHTML = '';
});

runBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  runBtn.disabled = true;
  resultEl.innerHTML = '';
  statusEl.textContent = '읽는 중이에요...';

  try {
    const { PDFDocument } = PDFLib;
    const bytes = await selectedFile.arrayBuffer();
    const srcDoc = await PDFDocument.load(bytes);
    const outDoc = await PDFDocument.create();
    const srcPages = srcDoc.getPages();

    const forceAll = document.getElementById('forceAll').checked;
    const widths = srcPages.map(p => p.getWidth());
    const minWidth = Math.min(...widths);
    const threshold = minWidth * 1.5;

    let splitCount = 0;

    for (let i = 0; i < srcPages.length; i++) {
      statusEl.textContent = `처리 중... (${i + 1}/${srcPages.length}페이지)`;
      const page = srcPages[i];
      const { width, height } = page.getSize();

      if (forceAll || width > threshold) {
        const mid = width / 2;

        const leftEmbed = await outDoc.embedPage(page, { left: 0, bottom: 0, right: mid, top: height });
        const leftPage = outDoc.addPage([mid, height]);
        leftPage.drawPage(leftEmbed, { x: 0, y: 0, width: mid, height });

        const rightEmbed = await outDoc.embedPage(page, { left: mid, bottom: 0, right: width, top: height });
        const rightPage = outDoc.addPage([mid, height]);
        rightPage.drawPage(rightEmbed, { x: 0, y: 0, width: mid, height });

        splitCount++;
      } else {
        const [copiedPage] = await outDoc.copyPages(srcDoc, [i]);
        outDoc.addPage(copiedPage);
      }
    }

    const outBytes = await outDoc.save();
    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    const baseName = selectedFile.name.replace(/\.pdf$/i, '');
    const outName = `${baseName}_한페이지씩.pdf`;

    statusEl.textContent = `완료! 원래 ${srcPages.length}페이지 중 ${splitCount}장을 나눠서 총 ${outDoc.getPageCount()}페이지가 되었어요.`;

    const a = document.createElement('a');
    a.href = url;
    a.download = outName;
    a.className = 'download';
    a.textContent = `${outName} 다운로드`;
    resultEl.appendChild(a);
    a.click();

  } catch (err) {
    statusEl.textContent = '오류가 발생했어요: ' + err.message;
  } finally {
    runBtn.disabled = false;
  }
});

// ---------- 직접 확인 모드 ----------
const fileInput2 = document.getElementById('fileInput2');
const previewBtn = document.getElementById('previewBtn');
const status2 = document.getElementById('status2');
const pageListEl = document.getElementById('pageList');
const globalControls = document.getElementById('globalControls');
const globalFrac = document.getElementById('globalFrac');
const applyFracAll = document.getElementById('applyFracAll');
const applyRotAll = document.getElementById('applyRotAll');
const exportBox = document.getElementById('exportBox');
const exportBtn = document.getElementById('exportBtn');
const result2 = document.getElementById('result2');

let selectedFile2 = null;
let pdfjsDoc = null;
let pageStates = []; // { rotation, frac, noSplit }

fileInput2.addEventListener('change', () => {
  selectedFile2 = fileInput2.files[0] || null;
  previewBtn.disabled = !selectedFile2;
  status2.textContent = '';
  pageListEl.innerHTML = '';
  globalControls.style.display = 'none';
  exportBox.style.display = 'none';
  result2.innerHTML = '';
});

function suggestGutterFraction(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const lo = Math.floor(w * 0.35), hi = Math.floor(w * 0.65);
  const bandWidth = hi - lo;
  if (bandWidth <= 0) return 0.5;

  const colSum = new Float64Array(bandWidth);
  const colCount = new Float64Array(bandWidth);

  function scanRows(y0, y1) {
    const rowH = y1 - y0;
    if (rowH <= 0) return;
    const data = ctx.getImageData(lo, y0, bandWidth, rowH).data;
    for (let y = 0; y < rowH; y++) {
      for (let x = 0; x < bandWidth; x++) {
        const idx = (y * bandWidth + x) * 4;
        const gray = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
        colSum[x] += gray;
        colCount[x] += 1;
      }
    }
  }

  scanRows(Math.floor(h * 0.02), Math.floor(h * 0.10));
  scanRows(Math.floor(h * 0.90), Math.floor(h * 0.98));

  let bestX = Math.floor(bandWidth / 2), bestVal = Infinity;
  for (let x = 0; x < bandWidth; x++) {
    if (colCount[x] === 0) continue;
    const avg = colSum[x] / colCount[x];
    if (avg < bestVal) { bestVal = avg; bestX = x; }
  }
  return (lo + bestX) / w;
}

async function renderPageToCanvas(pageNum, rotation, targetLongSide) {
  const page = await pdfjsDoc.getPage(pageNum);
  const baseVp = page.getViewport({ scale: 1, rotation });
  const scale = targetLongSide / Math.max(baseVp.width, baseVp.height);
  const viewport = page.getViewport({ scale, rotation });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

function updateCutline(card) {
  const idx = Number(card.dataset.idx);
  const state = pageStates[idx];
  const line = card.querySelector('.cutline');
  const wrap = card.querySelector('.canvas-wrap');
  if (state.noSplit) {
    line.style.display = 'none';
  } else {
    line.style.display = 'block';
    line.style.left = (state.frac * 100) + '%';
  }
}

previewBtn.addEventListener('click', async () => {
  previewBtn.disabled = true;
  pageListEl.innerHTML = '';
  status2.textContent = '미리보기를 만들고 있어요...';

  try {
    const bytes = await selectedFile2.arrayBuffer();
    pdfjsDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
    const numPages = pdfjsDoc.numPages;
    pageStates = [];

    for (let i = 1; i <= numPages; i++) {
      status2.textContent = `미리보기 만드는 중... (${i}/${numPages})`;
      const canvas = await renderPageToCanvas(i, 0, 500);
      const frac = suggestGutterFraction(canvas);
      pageStates.push({ rotation: 0, frac, noSplit: false });

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.idx = i - 1;
      card.innerHTML = `
        <div class="idx">${i} / ${numPages} 페이지</div>
        <div class="canvas-wrap"><div class="cutline"></div></div>
        <div class="page-controls">
          <label>자르는 위치: <input type="range" class="fracSlider" min="0" max="100" value="${Math.round(frac * 100)}"></label>
          <button class="rotateBtn secondary">회전</button>
          <label><input type="checkbox" class="noSplitBox"> 안 나눔 (이미 한 페이지)</label>
        </div>
      `;
      card.querySelector('.canvas-wrap').prepend(canvas);
      pageListEl.appendChild(card);
      updateCutline(card);

      const slider = card.querySelector('.fracSlider');
      slider.addEventListener('input', () => {
        pageStates[i - 1].frac = Number(slider.value) / 100;
        updateCutline(card);
      });

      const noSplitBox = card.querySelector('.noSplitBox');
      noSplitBox.addEventListener('change', () => {
        pageStates[i - 1].noSplit = noSplitBox.checked;
        slider.disabled = noSplitBox.checked;
        updateCutline(card);
      });

      const rotateBtn = card.querySelector('.rotateBtn');
      rotateBtn.addEventListener('click', async () => {
        const state = pageStates[i - 1];
        state.rotation = (state.rotation + 90) % 360;
        const newCanvas = await renderPageToCanvas(i, state.rotation, 500);
        const oldCanvas = card.querySelector('canvas');
        oldCanvas.replaceWith(newCanvas);
        card.querySelector('.canvas-wrap').prepend(newCanvas);
        updateCutline(card);
      });
    }

    globalControls.style.display = 'block';
    exportBox.style.display = 'block';
    status2.textContent = `${numPages}페이지를 확인해주세요. 빨간 선이 자르는 위치예요. 선을 드래그하듯 슬라이더로 옮기거나, 이미 한 페이지인 곳은 "안 나눔"에 체크해주세요.`;
  } catch (err) {
    status2.textContent = '오류가 발생했어요: ' + err.message;
  } finally {
    previewBtn.disabled = false;
  }
});

applyFracAll.addEventListener('click', () => {
  const frac = Number(globalFrac.value) / 100;
  document.querySelectorAll('.page-card').forEach(card => {
    const idx = Number(card.dataset.idx);
    if (pageStates[idx].noSplit) return;
    pageStates[idx].frac = frac;
    card.querySelector('.fracSlider').value = Math.round(frac * 100);
    updateCutline(card);
  });
});

applyRotAll.addEventListener('click', async () => {
  status2.textContent = '전체 페이지를 회전하고 있어요...';
  const cards = Array.from(document.querySelectorAll('.page-card'));
  for (const card of cards) {
    const idx = Number(card.dataset.idx);
    const state = pageStates[idx];
    state.rotation = (state.rotation + 90) % 360;
    const newCanvas = await renderPageToCanvas(idx + 1, state.rotation, 500);
    const oldCanvas = card.querySelector('canvas');
    oldCanvas.replaceWith(newCanvas);
    card.querySelector('.canvas-wrap').prepend(newCanvas);
    updateCutline(card);
  }
  status2.textContent = '회전이 모두 적용됐어요.';
});

exportBtn.addEventListener('click', async () => {
  exportBtn.disabled = true;
  result2.innerHTML = '';
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  const numPages = pdfjsDoc.numPages;

  try {
    for (let i = 1; i <= numPages; i++) {
      status2.textContent = `저장 준비 중... (${i}/${numPages})`;
      const state = pageStates[i - 1];
      const fullCanvas = await renderPageToCanvas(i, state.rotation, 2200);
      const w = fullCanvas.width, h = fullCanvas.height;

      const pieces = [];
      if (state.noSplit) {
        pieces.push([0, 0, w, h]);
      } else {
        const mid = Math.round(w * state.frac);
        pieces.push([0, 0, mid, h]);
        pieces.push([mid, 0, w - mid, h]);
      }

      for (const [sx, sy, sw, sh] of pieces) {
        const pieceCanvas = document.createElement('canvas');
        pieceCanvas.width = sw;
        pieceCanvas.height = sh;
        const ctx = pieceCanvas.getContext('2d');
        ctx.drawImage(fullCanvas, sx, sy, sw, sh, 0, 0, sw, sh);

        const jpgBytes = await new Promise(resolve => {
          pieceCanvas.toBlob(blob => {
            const reader = new FileReader();
            reader.onload = () => resolve(new Uint8Array(reader.result));
            reader.readAsArrayBuffer(blob);
          }, 'image/jpeg', 0.85);
        });

        const jpgImage = await outDoc.embedJpg(jpgBytes);
        const outPage = outDoc.addPage([sw, sh]);
        outPage.drawImage(jpgImage, { x: 0, y: 0, width: sw, height: sh });
      }
    }

    const outBytes = await outDoc.save();
    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    const baseName = selectedFile2.name.replace(/\.pdf$/i, '');
    const outName = `${baseName}_한페이지씩.pdf`;

    status2.textContent = `완료! 총 ${outDoc.getPageCount()}페이지로 저장했어요.`;

    const a = document.createElement('a');
    a.href = url;
    a.download = outName;
    a.className = 'download';
    a.textContent = `${outName} 다운로드`;
    result2.appendChild(a);
    a.click();
  } catch (err) {
    status2.textContent = '오류가 발생했어요: ' + err.message;
  } finally {
    exportBtn.disabled = false;
  }
});
</script>

</body>
</html>
